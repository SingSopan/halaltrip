openapi: 3.1.0
info:
  title: HalalTrip Backend API
  version: 1.0.0
  description: >-
    API HalalTrip untuk akun, preferensi, direktori tempat, perjalanan, itinerary,
    dan proxy Travel Recommendation API. Skema CRUD destination eksternal sengaja
    tidak didefinisikan karena backend meneruskan kontrak provider tanpa transformasi.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Recommendations
  - name: Provider destinations
  - name: Places
  - name: Saved places
  - name: Trips
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Proses API berjalan
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, const: ok } }, required: [status] }
              example: { status: ok }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe database
      responses:
        '200':
          description: Database tersedia
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string }, dependencies: { type: object, properties: { database: { type: string } } } } }
              example: { status: ready, dependencies: { database: available } }
        '503':
          $ref: '#/components/responses/NotReady'
  /api/v1/health/recommendation-provider:
    get:
      tags: [Health]
      summary: Periksa provider rekomendasi
      responses:
        '200': { description: Provider merespons; body diteruskan dari provider, schema opaque }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Daftarkan akun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 72 }
            example: { name: Alya, email: alya@example.com, password: password-kuat }
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Masuk dan dapatkan access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 1 } } }
            example: { email: alya@example.com, password: password-kuat }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/me:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Baca profil akun aktif
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } }, required: [user] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Perbarui nama dan/atau email
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, minProperties: 1, properties: { name: { type: string, minLength: 1, maxLength: 100 }, email: { type: string, format: email, maxLength: 254 } } }
      responses:
        '200':
          description: Profil diperbarui
          content:
            application/json:
              schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/me/preferences:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Baca preferensi perjalanan
      responses:
        '200':
          description: Preferensi tersimpan
          content:
            application/json:
              schema: { type: object, properties: { preferences: { $ref: '#/components/schemas/Preferences' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Simpan preferensi perjalanan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
            example: { interests: [culture, culinary], activity: Exploration, travel_type: Solo }
      responses:
        '200':
          description: Preferensi tersimpan
          content:
            application/json:
              schema: { type: object, properties: { preferences: { $ref: '#/components/schemas/Preferences' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/recommendations/cities:
    post:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }, {}]
      summary: Minta rekomendasi kota dari provider
      description: Bearer token opsional; preferensi tersimpan hanya dipakai bila ketiga field preferensi tidak dikirim.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { description: JSON provider diteruskan; schema response provider opaque }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /api/v1/recommendations/destinations:
    post:
      tags: [Recommendations]
      security: [{ bearerAuth: [] }, {}]
      summary: Minta rekomendasi destinasi dari provider
      description: Bearer token opsional. Request memerlukan city; response sukses diteruskan tanpa transformasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RecommendationRequest'
                - type: object
                  required: [city]
                  properties:
                    city: { type: string, minLength: 1 }
      responses:
        '200': { description: JSON provider diteruskan; schema response provider opaque }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /api/v1/destinations:
    get:
      tags: [Provider destinations]
      summary: Daftar destination milik provider
      responses:
        '200': { description: Body JSON provider diteruskan apa adanya; schema opaque }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
    post:
      tags: [Provider destinations]
      summary: Buat destination di provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: Kontrak mengikuti provider; field tidak ditentukan backend. }
      responses:
        '2XX': { description: Response sukses provider diteruskan; status/body mengikuti provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /api/v1/destinations/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProviderID' }
    get:
      tags: [Provider destinations]
      summary: Baca destination provider
      responses:
        '200': { description: JSON provider diteruskan; schema opaque }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
    put:
      tags: [Provider destinations]
      summary: Perbarui destination provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: Kontrak mengikuti provider; field tidak ditentukan backend. }
      responses:
        '2XX': { description: Response sukses provider diteruskan; status/body mengikuti provider }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
    delete:
      tags: [Provider destinations]
      summary: Hapus destination provider
      responses:
        '2XX': { description: Response sukses provider diteruskan }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '504': { $ref: '#/components/responses/Timeout' }
  /api/v1/restaurants:
    get:
      tags: [Places]
      summary: Cari restoran lokal
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/City' }, { $ref: '#/components/parameters/Country' }, { name: cuisine, in: query, schema: { type: string } }, { name: halal_status, in: query, schema: { type: string, enum: [certified, muslim_owned, halal_friendly, no_pork, unknown] } }, { name: price_range, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses: { '200': { $ref: '#/components/responses/PlaceList' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' } }
    post: { $ref: '#/components/pathItems/adminPlacePost' }
  /api/v1/restaurants/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get: { $ref: '#/components/pathItems/getPlace' }
    put: { $ref: '#/components/pathItems/adminPlacePut' }
    delete: { $ref: '#/components/pathItems/adminPlaceDelete' }
  /api/v1/mosques:
    get:
      tags: [Places]
      summary: Cari masjid dan fasilitas salat lokal
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/City' }, { $ref: '#/components/parameters/Country' }, { name: facility, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses: { '200': { $ref: '#/components/responses/PlaceList' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' } }
    post: { $ref: '#/components/pathItems/adminPlacePost' }
  /api/v1/mosques/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get: { $ref: '#/components/pathItems/getPlace' }
    put: { $ref: '#/components/pathItems/adminPlacePut' }
    delete: { $ref: '#/components/pathItems/adminPlaceDelete' }
  /api/v1/hotels:
    get:
      tags: [Places]
      summary: Cari hotel lokal
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Q' }, { $ref: '#/components/parameters/City' }, { $ref: '#/components/parameters/Country' }, { name: price_range, in: query, schema: { type: string } }, { name: feature, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/Order' }]
      responses: { '200': { $ref: '#/components/responses/PlaceList' }, '400': { $ref: '#/components/responses/BadRequest' }, '500': { $ref: '#/components/responses/InternalError' } }
    post: { $ref: '#/components/pathItems/adminPlacePost' }
  /api/v1/hotels/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get: { $ref: '#/components/pathItems/getPlace' }
    put: { $ref: '#/components/pathItems/adminPlacePut' }
    delete: { $ref: '#/components/pathItems/adminPlaceDelete' }
  /api/v1/saved-places:
    get:
      tags: [Saved places]
      security: [{ bearerAuth: [] }]
      summary: Daftar tempat tersimpan milik pengguna
      responses:
        '200':
          description: Daftar saved place beserta data tempat yang masih ada
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SavedPlace' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Saved places]
      security: [{ bearerAuth: [] }]
      summary: Simpan referensi tempat
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [place_type, place_id], properties: { place_type: { type: string, enum: [restaurant, mosque, hotel] }, place_id: { type: string, format: uuid } } }
      responses:
        '201':
          description: Referensi tempat berhasil disimpan
          content:
            application/json:
              schema: { type: object, required: [place_type, place_id], properties: { place_type: { type: string }, place_id: { type: string, format: uuid } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/saved-places/{place_type}/{place_id}:
    delete:
      tags: [Saved places]
      security: [{ bearerAuth: [] }]
      summary: Hapus saved place
      parameters:
        - { name: place_type, in: path, required: true, schema: { type: string, enum: [restaurant, mosque, hotel] } }
        - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '204': { description: Saved place dihapus }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/trips:
    post:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Buat trip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripInput' }
            example: { title: Liburan Yogyakarta, start_date: '2030-05-01', end_date: '2030-05-03', origin: Jakarta, status: planning }
      responses: { '201': { $ref: '#/components/responses/TripResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '500': { $ref: '#/components/responses/InternalError' } }
    get:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Daftar trip milik pengguna
      responses: { '200': { $ref: '#/components/responses/TripList' }, '401': { $ref: '#/components/responses/Unauthorized' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/trips/{tripId}:
    parameters: [{ $ref: '#/components/parameters/TripID' }]
    get:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Baca trip milik pengguna
      responses: { '200': { $ref: '#/components/responses/TripResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Perbarui sebagian data trip
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripPatch' }
      responses: { '200': { $ref: '#/components/responses/TripResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    delete:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Hapus trip dan item itinerary
      responses: { '204': { description: Trip dihapus }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/trips/{tripId}/itinerary-items:
    parameters: [{ $ref: '#/components/parameters/TripID' }]
    post:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Tambahkan item itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItineraryInput' }
      responses: { '201': { $ref: '#/components/responses/ItineraryResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    get:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Daftar item itinerary
      responses: { '200': { $ref: '#/components/responses/ItineraryList' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/trips/{tripId}/itinerary-items/order:
    put:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Atur ulang seluruh item itinerary
      description: item_ids harus memuat semua ID item trip tepat satu kali.
      parameters: [{ $ref: '#/components/parameters/TripID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [item_ids], properties: { item_ids: { type: array, items: { type: string, format: uuid } } } }
            example: { item_ids: ['00000000-0000-4000-8000-000000000001'] }
      responses: { '204': { description: Urutan tersimpan }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /api/v1/trips/{tripId}/itinerary-items/{itemId}:
    parameters: [{ $ref: '#/components/parameters/TripID' }, { $ref: '#/components/parameters/ItemID' }]
    patch:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Perbarui sebagian item itinerary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItineraryPatch' }
      responses: { '200': { $ref: '#/components/responses/ItineraryResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    delete:
      tags: [Trips]
      security: [{ bearerAuth: [] }]
      summary: Hapus item itinerary
      responses: { '204': { description: Item dihapus }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UUID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ProviderID: { name: id, in: path, required: true, description: ID opaque dari provider, schema: { type: string } }
    TripID: { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    ItemID: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Q: { name: q, in: query, schema: { type: string } }
    City: { name: city, in: query, schema: { type: string } }
    Country: { name: country, in: query, schema: { type: string } }
    Sort: { name: sort, in: query, schema: { type: string, enum: [name, city, created_at, updated_at], default: name } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
  pathItems:
    adminPlacePost:
      post:
        tags: [Places]
        security: [{ bearerAuth: [] }]
        summary: Buat entri direktori (admin)
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceInput' }
        responses: { '201': { $ref: '#/components/responses/PlaceResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '500': { $ref: '#/components/responses/InternalError' } }
    getPlace:
      get:
        tags: [Places]
        summary: Baca entri direktori
        responses: { '200': { $ref: '#/components/responses/PlaceResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    adminPlacePut:
      put:
        tags: [Places]
        security: [{ bearerAuth: [] }]
        summary: Ganti entri direktori (admin)
        requestBody:
          required: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceInput' }
        responses: { '200': { $ref: '#/components/responses/PlaceResult' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    adminPlaceDelete:
      delete:
        tags: [Places]
        security: [{ bearerAuth: [] }]
        summary: Hapus entri direktori (admin)
        responses: { '204': { description: Entri dihapus }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token tidak ada/tidak valid atau kredensial salah
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role admin diperlukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Konflik data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Kesalahan internal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotReady:
      description: Database tidak siap
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              dependencies: { type: object }
    ProviderError:
      description: Provider gagal; detail provider disamarkan
      content:
