    ItineraryPatch: { type: object, minProperties: 1, properties: { title: { type: string }, description: { type: string }, place_type: { type: string, enum: [destination, restaurant, mosque, hotel, custom_activity] }, external_place_id: { type: string }, scheduled_date: { type: string, format: date }, start_time: { type: string }, end_time: { type: string }, transport_mode: { type: string }, notes: { type: string } } }
