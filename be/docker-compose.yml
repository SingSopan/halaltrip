services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/halaltrip?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the environment}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      HTTP_CLIENT_TIMEOUT: 15s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    container_name: halaltrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: halaltrip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - halaltrip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d halaltrip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  halaltrip-postgres-data:
